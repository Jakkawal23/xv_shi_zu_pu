<title>許氏族谱</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ============ Design tokens ============
     Palette: celadon rice-paper ground, ink-blue text, vermillion
     seal-stamp accent, jade for structure/links. Grounded in the
     material world of a Chinese/Mien clan register (家先簿/族谱):
     brush-ink columns, a red name-chop, paper the colour of old jade.
  */
  :root {
    --paper: #E7EAE1;
    --paper-raised: #F5F7F1;
    --paper-sunken: #DCE0D5;
    --ink: #1B2321;
    --ink-soft: #4E594F;
    --ink-faint: #7C877D;
    --line: #C7CEC1;
    --seal: #A6362A;
    --seal-soft: #A6362A1a;
    --jade: #3F6B55;
    --jade-soft: #3F6B551a;
    --gold: #93732F;
    --shadow: 0 12px 32px -12px rgb(27 35 33 / 0.28);
    --font-display: "Noto Serif SC", "Noto Serif", serif;
    --font-body: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #141815;
      --paper-raised: #1D2420;
      --paper-sunken: #0F1310;
      --ink: #E7EAE1;
      --ink-soft: #A9B2A6;
      --ink-faint: #778175;
      --line: #2B332C;
      --seal: #DE6152;
      --seal-soft: #DE61522b;
      --jade: #7CB495;
      --jade-soft: #7CB4952b;
      --gold: #CBA75B;
      --shadow: 0 16px 40px -14px rgb(0 0 0 / 0.55);
    }
  }
  :root[data-theme="dark"] {
    --paper: #141815;
    --paper-raised: #1D2420;
    --paper-sunken: #0F1310;
    --ink: #E7EAE1;
    --ink-soft: #A9B2A6;
    --ink-faint: #778175;
    --line: #2B332C;
    --seal: #DE6152;
    --seal-soft: #DE61522b;
    --jade: #7CB495;
    --jade-soft: #7CB4952b;
    --gold: #CBA75B;
    --shadow: 0 16px 40px -14px rgb(0 0 0 / 0.55);
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    overflow-x: hidden;
  }
  ::selection { background: var(--seal-soft); }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  a { color: var(--jade); }
  button { font: inherit; color: inherit; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 64px; }

  /* ---------- Header ---------- */
  header.top {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .top-inner { max-width: 720px; margin: 0 auto; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 12px; }
  .title-row { display: flex; align-items: center; gap: 12px; }
  .chop {
    flex: none; width: 42px; height: 42px; border-radius: 9px;
    background: var(--seal); color: #F6ECE8;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 22px; font-weight: 700;
    box-shadow: var(--shadow);
    transform: rotate(-2deg);
  }
  .title-text h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700;
    font-size: 22px; letter-spacing: 0.02em; text-wrap: balance;
  }
  .title-text p { margin: 1px 0 0; font-size: 12.5px; color: var(--ink-soft); }

  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px;
  }
  .search svg { flex: none; opacity: 0.6; }
  .search input {
    border: none; background: transparent; outline: none; width: 100%;
    font: inherit; font-size: 15px; color: var(--ink);
  }
  .search input::placeholder { color: var(--ink-faint); }
  .search button.clear {
    flex: none; border: none; background: none; cursor: pointer;
    color: var(--ink-faint); padding: 2px; display: none;
  }
  .search.has-query button.clear { display: block; }

  /* ---------- Section headers ---------- */
  .section-label {
    font-size: 11.5px; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--ink-faint); font-weight: 600; margin: 28px 4px 10px;
  }

  /* ---------- Ancestor line (gen 1–19) ---------- */
  .ancestors-toggle {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 12px 14px; margin-top: 22px;
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 12px;
    cursor: pointer; text-align: left;
  }
  .ancestors-toggle .lbl { font-size: 14.5px; }
  .ancestors-toggle .lbl b { font-family: var(--font-display); }
  .ancestors-toggle .sub { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .ancestors-toggle .chev { transition: transform 0.18s ease; opacity: 0.65; }
  .ancestors-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }

  .ancestor-line {
    overflow: hidden; max-height: 0; transition: max-height 0.24s ease;
  }
  .ancestor-line.open { max-height: 900px; }
  .ancestor-line-inner {
    margin-top: 10px; padding: 6px 4px 4px 20px; border-left: 2px solid var(--line);
    display: flex; flex-direction: column; gap: 2px;
  }
  .ancestor-row {
    display: flex; align-items: baseline; gap: 10px; padding: 5px 8px;
    border-radius: 7px; font-size: 14px;
  }
  .ancestor-row:hover { background: var(--paper-raised); }
  .ancestor-row .gi { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); width: 40px; flex: none; font-variant-numeric: tabular-nums; }
  .ancestor-row .gn { font-family: var(--font-display); font-weight: 600; }
  .ancestor-row .gl { color: var(--ink-faint); font-size: 12px; }
  .ancestor-line-inner .arrow { padding: 4px 8px 2px; color: var(--jade); font-size: 12.5px; }

  /* ---------- Tree ---------- */
  .tree { margin-top: 10px; }
  .node { position: relative; }
  .node-children {
    margin-left: 19px; padding-left: 19px; border-left: 2px solid var(--line);
  }
  .node-row {
    display: flex; align-items: center; gap: 4px; padding: 3px 0;
  }
  .expand-btn {
    flex: none; width: 26px; height: 26px; border-radius: 7px; border: none;
    background: transparent; cursor: pointer; color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center;
  }
  .expand-btn:hover { background: var(--paper-raised); }
  .expand-btn svg { transition: transform 0.16s ease; }
  .expand-btn[aria-expanded="true"] svg { transform: rotate(90deg); }
  .expand-btn.spacer { visibility: hidden; }

  .person-chip {
    flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0;
    padding: 8px 10px; border-radius: 10px; border: 1px solid transparent;
    background: var(--paper-raised); cursor: pointer; text-align: left;
  }
  .person-chip:hover { border-color: var(--line); }
  .person-chip:focus-visible { outline: 2px solid var(--jade); outline-offset: 1px; }
  .avatar {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 600; font-size: 15px;
    color: var(--seal); background: var(--seal-soft);
    border: 1px solid color-mix(in srgb, var(--seal) 35%, transparent);
  }
  .avatar.gender-f { color: var(--jade); background: var(--jade-soft); border-color: color-mix(in srgb, var(--jade) 35%, transparent); }
  .person-meta { min-width: 0; flex: 1; }
  .person-name {
    font-family: var(--font-display); font-weight: 600; font-size: 15.5px;
    display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .person-name mark { background: var(--seal-soft); color: var(--seal); border-radius: 3px; }
  .person-sub {
    display: flex; gap: 6px 5px; align-items: center; margin-top: 1px; flex-wrap: wrap;
    font-size: 11.5px; color: var(--ink-soft);
  }
  .tag {
    flex: none; font-size: 10.5px; padding: 1px 6px; border-radius: 999px;
    background: var(--paper-sunken); color: var(--ink-soft); font-weight: 600;
  }
  .tag.adopted { background: var(--gold); color: #2a2110; }
  .tag.deceased { color: var(--ink-faint); font-style: italic; }
  .chip-phone { flex: none; color: var(--jade); opacity: 0.8; display: flex; }
  .person-thai {
    display: block; font-size: 12px; color: var(--ink-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
  }
  .match-hint {
    display: flex; align-items: center; gap: 4px; margin-top: 3px;
    font-size: 11px; color: var(--seal); background: var(--seal-soft);
    padding: 2px 8px; border-radius: 999px; width: fit-content; max-width: 100%;
  }
  .match-hint span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  mark { background: var(--seal-soft); color: var(--seal); border-radius: 3px; }

  /* ---------- Detail overlay ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgb(20 24 21 / 0.45);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; transition: opacity 0.18s ease; z-index: 50;
  }
  .overlay[hidden] { display: none; }
  .overlay.open { opacity: 1; }
  .panel {
    width: 100%; max-width: 460px; max-height: 86vh; overflow-y: auto;
    overscroll-behavior: contain;
    background: var(--paper); border-radius: 18px 18px 0 0;
    box-shadow: var(--shadow); padding: 20px 20px 28px;
    transform: translateY(16px); transition: transform 0.2s ease;
  }
  .overlay.open .panel { transform: translateY(0); }
  @media (min-width: 640px) {
    .overlay { align-items: center; }
    .panel { border-radius: 16px; margin: 24px; }
  }

  .panel-top { display: flex; justify-content: flex-end; }
  .panel-close {
    border: none; background: var(--paper-raised); border-radius: 8px;
    width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--ink-soft);
  }
  .panel-head { display: flex; gap: 14px; align-items: center; margin: 4px 0 18px; }
  .panel-head .avatar { width: 56px; height: 56px; font-size: 24px; }
  .panel-head h2 { margin: 0; font-family: var(--font-display); font-size: 25px; font-weight: 700; }
  .panel-head .thai-name { font-size: 13.5px; color: var(--ink-soft); margin-top: 1px; }
  .panel-head .gens { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }

  .panel-section { margin-top: 18px; }
  .panel-section h3 {
    margin: 0 0 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--ink-faint); font-weight: 700;
  }
  .info-row {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 13px; background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 11px; margin-bottom: 8px;
  }
  .info-icon {
    flex: none; width: 30px; height: 30px; border-radius: 8px;
    background: var(--paper-sunken); color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center;
  }
  .info-body { flex: 1; min-width: 0; }
  .info-label { display: block; font-size: 11px; color: var(--ink-faint); }
  .info-value {
    display: block; font-size: 14.5px; word-break: break-word;
  }
  .info-value.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .info-value.empty { color: var(--ink-faint); }
  .call-btn {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    background: var(--jade); color: var(--paper-raised); text-decoration: none;
    font-size: 12.5px; font-weight: 600; padding: 6px 11px; border-radius: 999px;
  }
  .spouse-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .spouse-name { font-family: var(--font-display); font-weight: 600; font-size: 15.5px; }
  .spouse-thai { font-size: 12.5px; color: var(--ink-soft); }
  .extra-row {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 9px 13px; background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 10px; margin-bottom: 6px;
  }
  .extra-row .k { flex: none; font-size: 12.5px; color: var(--ink-soft); }
  .extra-row .v { flex: 1; text-align: right; font-size: 14px; word-break: break-word; }

  .parent-link {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    background: none; border: none; padding: 0; color: var(--jade); font-size: 14px; font-weight: 600;
  }
  .children-grid { display: flex; flex-wrap: wrap; gap: 7px; }
  .child-chip {
    cursor: pointer; border: 1px solid var(--line); background: var(--paper-raised);
    border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-family: var(--font-display);
  }
  .child-chip:hover { border-color: var(--jade); color: var(--jade); }
  .muted { color: var(--ink-faint); font-size: 13.5px; }

  footer {
    margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--ink-faint); text-align: center;
  }

  .empty-state { text-align: center; padding: 40px 10px; color: var(--ink-soft); font-size: 14px; }
  .load-error { text-align: left; max-width: 480px; margin: 40px auto; line-height: 1.6; }
  .load-error p { margin: 0 0 10px; }
  .load-error b { color: var(--seal); }

  /* ---------- Theme toggle ---------- */
  .theme-toggle {
    margin-left: auto; flex: none; width: 38px; height: 38px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .theme-toggle:hover { border-color: var(--jade); color: var(--jade); }
  .theme-toggle:focus-visible { outline: 2px solid var(--jade); outline-offset: 1px; }
</style>

<script>
// Runs immediately (before the rest of the page paints) so the theme is
// correct on first frame, no flash. Default is always light mode unless
// the viewer previously switched to dark on this device — this page does
// NOT follow the OS/browser dark-mode setting automatically.
(function () {
  "use strict";
  var STORAGE_KEY = "xu-jiapu-theme";
  function getStored() {
    try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
  }
  function setStored(v) {
    try { localStorage.setItem(STORAGE_KEY, v); } catch (e) {}
  }
  var initialTheme = getStored() === "dark" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", initialTheme);

  document.addEventListener("DOMContentLoaded", function () {
    var sun = document.getElementById("themeIconSun");
    var moon = document.getElementById("themeIconMoon");
    function syncIcons(theme) {
      if (!sun || !moon) return;
      sun.hidden = theme === "dark";
      moon.hidden = theme !== "dark";
    }
    syncIcons(initialTheme);
    var btn = document.getElementById("themeToggle");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
      var next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      setStored(next);
      syncIcons(next);
    });
  });
})();
</script>

  แล้วรีเฟรชหน้าเว็บ ไม่ต้องแตะไฟล์นี้เลย โครงสร้าง JSON เต็ม ๆ พร้อม

  โหลด family-data.json ได้ (ข้อจำกัดความปลอดภัยของเบราว์เซอร์เอง ไม่ใช่บั๊ก)
  ต้องเปิดผ่านเว็บเซิร์ฟเวอร์ — รันในเครื่อง หรือโฮสต์บน GitHub Pages ก็ได้

<header class="top">
  <div class="top-inner">
    <div class="title-row">
      <div class="chop" id="chopMark">許</div>
      <div class="title-text">
        <h1 id="pageTitle">許氏族谱</h1>
        <p id="pageSubtitle">ผังลำดับวงศ์ตระกูล · แตะชื่อเพื่อดูข้อมูลติดต่อ</p>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="สลับโหมดกลางวัน/กลางคืน" title="สลับโหมดกลางวัน/กลางคืน">
        <span id="themeIconSun"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></span>
        <span id="themeIconMoon" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
      </button>
    </div>
    <label class="search" id="searchBox">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="text" inputmode="search" placeholder="ค้นหาชื่อ (จีน/พินอิน), เบอร์โทร หรือชื่อคู่สมรส" autocomplete="off" />
      <button class="clear" id="clearSearch" aria-label="ล้างคำค้นหา">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </label>
  </div>
</header>

<main class="wrap">
  <div id="ancestorsBlock">
    <button class="ancestors-toggle" id="ancestorsToggle" aria-expanded="false">
      <span class="lbl"><b>สายบรรพบุรุษ</b> — 一世祖 ถึง 第十九代
        <span class="sub">19 รุ่นแรกของตระกูล เรียงเป็นเส้นตรง ก่อนถึงรุ่น 許慶洪 ที่แตกสาย</span>
      </span>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="ancestor-line" id="ancestorLine">
      <div class="ancestor-line-inner" id="ancestorLineInner"></div>
    </div>
  </div>

  <div class="section-label" id="treeLabel">กำลังโหลด…</div>
  <div class="tree" id="tree"><div class="empty-state">กำลังโหลดข้อมูล…</div></div>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="panel" id="panel" role="dialog" aria-modal="true"></div>
</div>

<script>
function initApp(DATA) {
  "use strict";
  var people = DATA.people;
  var byId = {};
  var childrenOf = {};
  people.forEach(function (p) {
    byId[p.id] = p;
    childrenOf[p.id] = childrenOf[p.id] || [];
  });
  people.forEach(function (p) {
    if (p.parentId) {
      childrenOf[p.parentId] = childrenOf[p.parentId] || [];
      childrenOf[p.parentId].push(p);
    }
  });

  document.getElementById("pageTitle").textContent = DATA.meta.title || "族谱";
  document.getElementById("chopMark").textContent = DATA.meta.surname || "氏";
  if (DATA.meta.subtitle) {
    document.getElementById("pageSubtitle").textContent =
      DATA.meta.subtitle + " · แตะชื่อเพื่อดูข้อมูลติดต่อ";
  }

  var ORDER_TH = {

    } else {
      ancestorsBlock.hidden = false;
      setAncestorOpen(ancestorOpenManual, false);
    }
  }

  function renderAncestorLine(searchVisible) {
    var ids = [];
    for (var i = 1; i <= 19; i++) ids.push("p" + i);
    if (searchVisible) ids = ids.filter(function (id) { return searchVisible[id]; });
    var inner = document.getElementById("ancestorLineInner");
    inner.innerHTML = ids.map(function (id) {
      var p = byId[id];
      return '<button class="ancestor-row person-chip" data-open="' + p.id + '" style="all:unset;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:5px 8px;border-radius:7px;font-size:14px;width:100%;box-sizing:border-box;">' +
        '<span class="gi">' + p.gen + '</span>' +
        '<span class="gn">' + highlightName(p.name) + '</span>' +
        '<span class="gl">' + escapeHtml(p.genLabel) + '</span>' +
        '</button>';
    }).join("") + (ids.length ? '<div class="arrow">↓ สืบสายสู่ ' + escapeHtml(byId[TREE_ROOT_ID].name) + ' (第二十代) ซึ่งเป็นจุดแตกสายตระกูล</div>' : '');
  }

  // `manual` marks a change as the user's own choice (persisted and
  // restored once search is cleared); an automatic open while a search
  // match lives in the ancestor line is not persisted.
  var ancestorOpenManual = false;
  function setAncestorOpen(open, manual) {
    if (manual) ancestorOpenManual = open;
    var toggle = document.getElementById("ancestorsToggle");
    var line = document.getElementById("ancestorLine");
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
    line.classList.toggle("open", open);
  }

  // ---------- detail panel ----------
  function openPanel(id) {
    var p = byId[id];
    if (!p) return;
    var kids = childrenOf[id] || [];
    var parent = p.parentId ? byId[p.parentId] : null;
    var genderClass = p.gender === "F" ? " gender-f" : "";

    var html = '<div class="panel-top"><button class="panel-close" id="panelClose" aria-label="ปิด">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>';

    html += '<div class="panel-head">';
    html += '<span class="avatar' + genderClass + '">' + escapeHtml(avatarLetter(p.name)) + '</span>';
    html += '<div><h2>' + escapeHtml(p.name) + '</h2>';
    if (p.thaiName) html += '<div class="thai-name">' + escapeHtml(p.thaiName) + '</div>';
    html += '<div class="gens">';
    html += '<span class="tag">รุ่นที่ ' + p.gen + ' · ' + escapeHtml(p.genLabel) + '</span>';
    if (p.order) html += '<span class="tag">' + escapeHtml(ORDER_TH[p.order] || p.order) + '</span>';
    if (p.adopted) html += '<span class="tag adopted">บุตรบุญธรรม</span>';
    html += '</div></div></div>';

    if (p.birthDate || p.deathDate) {
      html += '<div class="panel-section"><h3>วันเกิด – วันเสียชีวิต</h3>';
      html += '<div class="info-row"><span class="info-icon">' + calendarIconSvg() + '</span><span class="info-body">' +
        '<span class="info-label">วันเกิด</span><span class="info-value' + (p.birthDate ? '' : ' empty') + '">' +
        escapeHtml(p.birthDate ? formatThaiDate(p.birthDate) : "ไม่ทราบ") + '</span></span></div>';
      if (p.deathDate) {
        html += '<div class="info-row"><span class="info-icon">' + calendarIconSvg() + '</span><span class="info-body">' +
          '<span class="info-label">วันเสียชีวิต</span><span class="info-value">' + escapeHtml(formatThaiDate(p.deathDate)) + '</span></span></div>';
      }
      var ageLine = lifeStatusTag(p);
      if (ageLine) {
        var ageOnly = ageLine.replace(/^เสียชีวิตแล้ว\s*·\s*/, "");
        html += '<div class="info-row"><span class="info-icon">' + hourglassIconSvg() + '</span><span class="info-body">' +
          '<span class="info-label">' + (p.deathDate ? "อายุตอนเสียชีวิต" : "อายุปัจจุบัน") + '</span><span class="info-value">' + escapeHtml(ageOnly) + '</span></span></div>';
      }
      html += '</div>';
    }

    html += '<div class="panel-section"><h3>ข้อมูลติดต่อ</h3>' + contactRowsHtml(p, "ยังไม่มีข้อมูลติดต่อ") + '</div>';

    if (p.extra && p.extra.length) {
      html += '<div class="panel-section"><h3>ข้อมูลอื่น ๆ</h3>' + extraRowsHtml(p.extra) + '</div>';
    }

    if (p.spouse && p.spouse.name) {
      html += '<div class="panel-section"><h3>คู่สมรส</h3>';
      html += '<div class="spouse-head"><span class="spouse-name">' + escapeHtml(p.spouse.name) + '</span>';
      if (p.spouse.thaiName) html += '<span class="spouse-thai">' + escapeHtml(p.spouse.thaiName) + '</span>';
      html += '</div>';
      html += contactRowsHtml(p.spouse, "ยังไม่มีข้อมูลติดต่อคู่สมรส");
      html += extraRowsHtml(p.spouse.extra);
      html += '</div>';
    }

    if (p.notes) {
      html += '<div class="panel-section"><h3>รายละเอียดเพิ่มเติม</h3><p class="muted">' + escapeHtml(p.notes) + '</p></div>';
    }

    if (parent) {
      html += '<div class="panel-section"><h3>สายตระกูล</h3><button class="parent-link" data-open="' + parent.id + '">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>' +
        'บุตรของ ' + escapeHtml(parent.name) + '</button></div>';
    }

    html += '<div class="panel-section"><h3>ทายาท (' + kids.length + ' คน)</h3>';
    if (kids.length) {
      html += '<div class="children-grid">' + kids.map(function (k) {
        return '<button class="child-chip" data-open="' + k.id + '">' + escapeHtml(k.name) + '</button>';
      }).join("") + '</div>';
    } else {
      html += '<p class="muted">ไม่มีข้อมูลทายาทในทำเนียบนี้</p>';
    }
    html += '</div>';

    document.getElementById("panel").innerHTML = html;
    openOverlay();
  }

  // The overlay stays `hidden` (removed from layout and hit-testing
  // entirely — the harness's `[hidden]{display:none!important}` rule and
  // our own guarantee it) whenever it's closed, so there is never a
  // window where background content can be clicked or scrolled through
  // "behind" it. Body scroll is locked too, and unhidden only after the
  // close transition finishes so the fade-out is still visible.
  var closeTimer = null;
  function openOverlay() {
    var overlay = document.getElementById("overlay");
    if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
    overlay.hidden = false;
    document.body.style.overflow = "hidden";
    // Force a reflow so the browser registers the un-hidden state before
    // the "open" class flips opacity — otherwise the fade-in transition
    // can get skipped.
    void overlay.offsetHeight;
    overlay.classList.add("open");
  }
  function closePanel() {
    var overlay = document.getElementById("overlay");
    overlay.classList.remove("open");
    document.body.style.overflow = "";
    closeTimer = setTimeout(function () { overlay.hidden = true; }, 200);
  }

  // ---------- events (delegated) ----------
  document.addEventListener("click", function (e) {
    var toggleBtn = e.target.closest("[data-toggle]");
    if (toggleBtn) {
      var id = toggleBtn.getAttribute("data-toggle");
      expanded[id] = !expanded[id];
      render();
      return;
    }
    var openBtn = e.target.closest("[data-open]");
    if (openBtn) {
      openPanel(openBtn.getAttribute("data-open"));
      return;
    }
    if (e.target.id === "panelClose" || e.target.closest("#panelClose")) {
      closePanel();
      return;
    }
    if (e.target.id === "overlay") {
      closePanel();
      return;
    }
    if (e.target.id === "ancestorsToggle" || e.target.closest("#ancestorsToggle")) {
      var line = document.getElementById("ancestorLine");
      setAncestorOpen(!line.classList.contains("open"), true);
      return;
    }
    if (e.target.id === "clearSearch" || e.target.closest("#clearSearch")) {
      var input = document.getElementById("searchInput");
      input.value = "";
      searchQuery = "";
      document.getElementById("searchBox").classList.remove("has-query");
      render();
      input.focus();
      return;
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closePanel();
  });

  document.getElementById("searchInput").addEventListener("input", function (e) {
    searchQuery = e.target.value.trim();
    document.getElementById("searchBox").classList.toggle("has-query", !!searchQuery);
    render();
  });

  var footerP = document.getElementById("footerNote");
  if (footerP) {
    footerP.textContent = "ทำเนียบวงศ์ตระกูล " + (DATA.meta.surname || "") +
      " — ข้อมูล ณ วันที่ " + (DATA.meta.updated || "-") +
      " · แก้ไขข้อมูลได้ที่ family-data.json";
  }

  render();
}

// ---------- bootstrap: load family-data.json from beside this file ----------
(function () {
  "use strict";
  function showLoadError() {
    var block = document.getElementById("ancestorsBlock");
    if (block) block.hidden = true;
    var label = document.getElementById("treeLabel");
    if (label) label.textContent = "โหลดข้อมูลไม่สำเร็จ";
    var tree = document.getElementById("tree");
    if (tree) {
      tree.innerHTML =
        '<div class="empty-state load-error">' +
        '<p><b>โหลด family-data.json ไม่สำเร็จ</b></p>' +
        '<p>ถ้าเปิดไฟล์ index.html นี้ด้วยการดับเบิลคลิกโดยตรง (file://) เบราว์เซอร์จะบล็อกไม่ให้โหลดไฟล์ข้อมูลแยกได้ — เป็นข้อจำกัดด้านความปลอดภัยของเบราว์เซอร์เอง ไม่ใช่ไฟล์เสีย</p>' +
        '<p>วิธีแก้: เปิดผ่านเว็บเซิร์ฟเวอร์ในเครื่อง หรือโฮสต์บน GitHub Pages — ดูคำสั่งแบบละเอียดใน README.md</p>' +
        '</div>';
    }
  }

  fetch("./family-data.json")
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (data) {
      initApp(data);
    })
    .catch(function (err) {
      console.error("โหลด family-data.json ไม่สำเร็จ:", err);
      showLoadError();
    });
})();
</script>

<footer class="wrap" style="max-width:720px;margin:0 auto;">
  <p id="footerNote"></p>
</footer>
